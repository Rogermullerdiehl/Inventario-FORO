<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inventário — Foro de Ivoti</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F6F5F1;
    --surface: #FFFFFF;
    --surface-2: #EFEEE8;
    --ink: #1C2431;
    --ink-dim: #5A6172;
    --line: #DEDCD3;
    --navy: #1B2A4A;
    --navy-2: #2B3E63;
    --gold: #9C7B3F;
    --danger: #9B3B3B;
    --danger-soft: #F4E4E1;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3, .brand { font-family: 'Source Serif 4', Georgia, serif; }

  header { position: sticky; top: 0; background: var(--navy); color: #fff; z-index: 20; }
  .header-inner { max-width: 1100px; margin: 0 auto; padding: 16px 20px; display: flex; align-items: baseline; gap: 12px; justify-content: space-between; flex-wrap: wrap; }
  .brand { font-size: 1.35rem; font-weight: 600; }
  .brand small { display: block; font-family: 'Inter', sans-serif; font-size: 0.72rem; font-weight: 500; color: var(--gold); margin-top: 2px; letter-spacing: 0.4px; }
  .status-pill { font-size: 0.78rem; color: #cdd6e8; }

  main { max-width: 1100px; margin: 0 auto; padding: 24px 20px 80px; }

  .toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 18px; }
  .toolbar input[type="search"] { flex: 1 1 220px; padding: 10px 14px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-size: 0.95rem; }
  select { padding: 10px 12px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-size: 0.9rem; max-width: 220px; }
  button { font-family: inherit; cursor: pointer; border: none; border-radius: var(--radius); padding: 10px 16px; font-size: 0.9rem; font-weight: 600; }
  .btn-primary { background: var(--navy); color: #fff; }
  .btn-primary:hover { background: var(--navy-2); }
  .btn-ghost { background: var(--surface); color: var(--ink); border: 1px solid var(--line); }
  .btn-ghost:hover { background: var(--surface-2); }
  .btn-danger { background: var(--danger-soft); color: var(--danger); }
  .btn-sm { padding: 6px 10px; font-size: 0.8rem; }
  button:disabled { opacity: 0.6; cursor: default; }

  .summary { color: var(--ink-dim); font-size: 0.85rem; margin-bottom: 14px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
  .card {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    overflow: hidden; display: flex; flex-direction: column; cursor: pointer;
    transition: transform 0.16s ease, box-shadow 0.16s ease, border-color 0.16s ease;
  }
  .card:hover, .card:focus-within {
    transform: translateY(-4px);
    box-shadow: 0 14px 28px rgba(27, 42, 74, 0.14);
    border-color: var(--navy);
  }
  .card .thumb { aspect-ratio: 4/3; background: var(--surface-2); display: flex; align-items: center; justify-content: center; color: var(--ink-dim); font-size: 0.75rem; overflow: hidden; }
  .card .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.2s ease; }
  .card:hover .thumb img { transform: scale(1.04); }
  .card-body { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .card-loc { font-size: 0.72rem; color: var(--gold); font-weight: 600; }
  .card-desc { font-size: 0.95rem; font-weight: 600; line-height: 1.3; }
  .card-code { font-size: 0.78rem; color: var(--ink-dim); font-family: ui-monospace, monospace; }
  .card-actions { margin-top: auto; display: flex; gap: 6px; padding-top: 8px; }

  .empty { text-align: center; padding: 60px 20px; color: var(--ink-dim); }
  .empty h3 { color: var(--ink); margin-bottom: 6px; }

  .modal-backdrop { position: fixed; inset: 0; background: rgba(10, 14, 22, 0.55); display: flex; align-items: flex-end; justify-content: center; z-index: 50; }
  @media (min-width: 640px) { .modal-backdrop { align-items: center; } }
  .modal { background: var(--surface); width: 100%; max-width: 480px; max-height: 92vh; overflow-y: auto; border-radius: 16px 16px 0 0; padding: 22px 20px; }
  @media (min-width: 640px) { .modal { border-radius: 16px; } }
  .modal h2 { margin: 0 0 16px; font-size: 1.2rem; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 0.8rem; font-weight: 600; color: var(--ink-dim); margin-bottom: 5px; }
  .field input[type="text"], .field select, .field textarea { width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font-size: 0.95rem; font-family: inherit; }
  .field textarea { resize: vertical; min-height: 60px; }
  .code-row { display: flex; gap: 8px; }
  .code-row input { flex: 1; }

  .photo-zone { border: 1.5px dashed var(--line); border-radius: 10px; padding: 14px; text-align: center; color: var(--ink-dim); font-size: 0.85rem; cursor: pointer; background: var(--bg); }
  .photo-zone img { max-width: 100%; max-height: 160px; border-radius: 8px; display: block; margin: 0 auto 8px; }

  #qr-reader { width: 100%; border-radius: 10px; overflow: hidden; margin-bottom: 10px; }
  #qr-reader video { border-radius: 10px; }

  .modal-actions { display: flex; gap: 8px; margin-top: 18px; }
  .modal-actions button { flex: 1; }

  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--navy); color: #fff; padding: 10px 18px; border-radius: 999px; font-size: 0.85rem; z-index: 80; opacity: 0; transition: opacity 0.25s ease; pointer-events: none; }
  .toast.show { opacity: 1; }

  .locais-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; max-height: 180px; overflow-y: auto; }
  .locais-list .li { display: flex; justify-content: space-between; align-items: center; padding: 6px 10px; background: var(--bg); border-radius: 6px; font-size: 0.85rem; }

  .config-banner { background: var(--gold); color: #2b220f; padding: 10px 20px; font-size: 0.85rem; text-align: center; }
  .config-banner a { color: #2b220f; }

  .lightbox-backdrop { position: fixed; inset: 0; background: rgba(10,14,22,0.85); display: flex; align-items: center; justify-content: center; z-index: 90; padding: 24px; cursor: zoom-out; }
  .lightbox-backdrop img { max-width: 100%; max-height: 90vh; border-radius: 8px; box-shadow: 0 20px 50px rgba(0,0,0,0.4); }
</style>
</head>
<body>

<div class="config-banner" id="configBanner" style="display:none;">
  Antes de usar, defina a URL do Apps Script na constante <code>API_URL</code> no início do script deste arquivo.
</div>

<header>
  <div class="header-inner">
    <div class="brand">Inventário de Bens
      <small>FORO DE IVOTI</small>
    </div>
    <div class="status-pill" id="statusPill">carregando…</div>
  </div>
</header>

<main>
  <div class="toolbar">
    <input type="search" id="searchInput" placeholder="Buscar por descrição ou código…">
    <select id="filterLocal"><option value="">Todos os locais</option></select>
    <button class="btn-ghost" id="btnLocais">Locais</button>
    <button class="btn-primary" id="btnAdd">+ Novo item</button>
  </div>

  <div class="summary" id="summary"></div>

  <div id="grid" class="grid"></div>
  <div id="emptyState" class="empty" style="display:none;">
    <h3>Nenhum item ainda</h3>
    <p>Cadastre o primeiro bem clicando em "+ Novo item".</p>
  </div>
</main>

<div class="modal-backdrop" id="itemModalBackdrop" style="display:none;">
  <div class="modal">
    <h2 id="itemModalTitle">Novo item</h2>
    <div class="field">
      <label>Local</label>
      <select id="fLocal"></select>
    </div>
    <div class="field">
      <label>Descrição</label>
      <textarea id="fDescricao" placeholder="Ex.: Cadeira giratória, mesa de reunião…"></textarea>
    </div>
    <div class="field">
      <label>Código / etiqueta (QR)</label>
      <div class="code-row">
        <input type="text" id="fCodigo" placeholder="Escaneie ou digite o código">
        <button class="btn-ghost btn-sm" id="btnScan" type="button">📷 Ler QR</button>
      </div>
      <div id="qr-reader" style="display:none;"></div>
    </div>
    <div class="field">
      <label>Foto</label>
      <div class="photo-zone" id="photoZone">
        <span id="photoZoneText">Toque para tirar ou escolher uma foto</span>
      </div>
      <input type="file" id="fFoto" accept="image/*" capture="environment" style="display:none;">
    </div>
    <div class="modal-actions">
      <button class="btn-ghost" id="btnCancelItem" type="button">Cancelar</button>
      <button class="btn-primary" id="btnSaveItem" type="button">Salvar</button>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="locaisModalBackdrop" style="display:none;">
  <div class="modal">
    <h2>Gerenciar locais</h2>
    <div class="locais-list" id="locaisList"></div>
    <div class="field code-row" style="margin-bottom:6px;">
      <input type="text" id="novoLocal" placeholder="Ex.: VARA JUDICIAL \ CARTÓRIO">
      <button class="btn-primary btn-sm" id="btnAddLocal" type="button">Adicionar</button>
    </div>
    <div class="modal-actions">
      <button class="btn-ghost" id="btnCloseLocais" type="button">Fechar</button>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="confirmModalBackdrop" style="display:none;">
  <div class="modal" style="max-width:380px;">
    <h2 id="confirmModalTitle">Excluir item</h2>
    <p id="confirmModalText" style="color:var(--ink-dim); font-size:0.92rem; margin:0 0 18px;"></p>
    <div class="modal-actions">
      <button class="btn-ghost" id="btnConfirmCancel" type="button">Cancelar</button>
      <button class="btn-danger" id="btnConfirmOk" type="button">Excluir</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
(function () {
  "use strict";

  // ======================================================================
  // URL do Apps Script (termina em /exec). Os dados são buscados com
  // ?action=data, porque a mesma URL também serve a página do inventário.
  // ======================================================================
  const API_URL = "https://script.google.com/macros/s/AKfycbyBfxoWnvzPC94e6-xLuxkUnS6EKY5D8qlYSk-c232YDCd6BoCZuAJmLcguM64WcXPn/exec";
  const DATA_URL = API_URL + "?action=data";

  let items = [];
  let locais = [];
  let editingId = null;
  let pendingPhoto = null;
  let html5QrCode = null;

  const $ = (sel) => document.querySelector(sel);
  const grid = $("#grid");
  const emptyState = $("#emptyState");
  const summary = $("#summary");
  const statusPill = $("#statusPill");
  const filterLocal = $("#filterLocal");
  const searchInput = $("#searchInput");

  function toast(msg) {
    const t = $("#toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(t._h);
    t._h = setTimeout(() => t.classList.remove("show"), 2600);
  }

  function escapeHtml(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  // ---------- API helpers ----------
  // Content-Type "text/plain" evita o preflight OPTIONS, que o Apps Script não trata.
  async function apiGet() {
    const res = await fetch(DATA_URL, { method: "GET" });
    return res.json();
  }
  async function apiPost(body) {
    const res = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(body)
    });
    return res.json();
  }

  // ---------- Init ----------
  async function init() {
    if (API_URL.indexOf("COLE_AQUI") !== -1 || !API_URL) {
      $("#configBanner").style.display = "block";
      statusPill.textContent = "não configurado";
      return;
    }
    statusPill.textContent = "carregando…";
    try {
      await refreshAll();
      statusPill.textContent = "conectado";
    } catch (e) {
      statusPill.textContent = "sem conexão";
      toast("Não foi possível conectar à planilha. Confira a URL do Apps Script.");
    }
  }

  async function refreshAll() {
    const data = await apiGet();
    if (!data.ok) throw new Error(data.error || "Falha ao carregar dados");
    items = data.items || [];
    locais = data.locais || [];
    if (!locais.length) locais = ["IVOTI - FORO \\ VARA JUDICIAL \\ CARTÓRIO"];
    renderLocaisSelects();
    renderLocaisModal();
    renderGrid();
  }

  // ---------- Locais ----------
  function renderLocaisSelects() {
    const current = filterLocal.value;
    filterLocal.innerHTML = '<option value="">Todos os locais</option>' +
      locais.map((l) => `<option value="${escapeHtml(l)}">${escapeHtml(l)}</option>`).join("");
    filterLocal.value = current;
    $("#fLocal").innerHTML = locais.map((l) => `<option value="${escapeHtml(l)}">${escapeHtml(l)}</option>`).join("");
  }

  function renderLocaisModal() {
    const list = $("#locaisList");
    list.innerHTML = locais.map((l) =>
      `<div class="li"><span>${escapeHtml(l)}</span><button class="btn-danger btn-sm" data-local="${escapeHtml(l)}" type="button">remover</button></div>`
    ).join("") || '<div style="color:var(--ink-dim); font-size:0.85rem;">Nenhum local cadastrado.</div>';
    list.querySelectorAll("button[data-local]").forEach((b) => {
      b.addEventListener("click", async () => {
        b.disabled = true;
        try {
          await apiPost({ action: "deleteLocal", local: b.dataset.local });
          await refreshAll();
        } catch (e) { toast("Não foi possível remover o local."); }
      });
    });
  }

  $("#btnLocais").addEventListener("click", () => { $("#locaisModalBackdrop").style.display = "flex"; });
  $("#btnCloseLocais").addEventListener("click", () => { $("#locaisModalBackdrop").style.display = "none"; });
  $("#btnAddLocal").addEventListener("click", async () => {
    const v = $("#novoLocal").value.trim();
    if (!v) return;
    $("#btnAddLocal").disabled = true;
    try {
      await apiPost({ action: "addLocal", local: v });
      $("#novoLocal").value = "";
      await refreshAll();
    } catch (e) { toast("Não foi possível adicionar o local."); }
    $("#btnAddLocal").disabled = false;
  });

  // ---------- Items ----------
  function renderGrid() {
    const q = (searchInput.value || "").toLowerCase().trim();
    const loc = filterLocal.value;
    const filtered = items.filter((it) => {
      const matchesQ = !q || String(it.descricao || "").toLowerCase().includes(q) || String(it.codigo || "").toLowerCase().includes(q);
      const matchesLoc = !loc || it.local === loc;
      return matchesQ && matchesLoc;
    }).sort((a, b) => (b.criadoEm || 0) - (a.criadoEm || 0));

    summary.textContent = `${filtered.length} de ${items.length} ${items.length === 1 ? "item" : "itens"}`;

    if (!filtered.length) {
      grid.style.display = "none";
      emptyState.style.display = "block";
      emptyState.querySelector("p").textContent = items.length
        ? "Nenhum item corresponde à busca."
        : 'Cadastre o primeiro bem clicando em "+ Novo item".';
      return;
    }
    grid.style.display = "grid";
    emptyState.style.display = "none";

    grid.innerHTML = filtered.map((it) => `
      <div class="card" data-id="${it.id}">
        <div class="thumb" ${it.fotoUrl ? `data-photo="${escapeHtml(it.fotoUrl)}"` : ""}>${it.fotoUrl ? `<img src="${it.fotoUrl}" alt="">` : "sem foto"}</div>
        <div class="card-body">
          <div class="card-loc">${escapeHtml(it.local || "sem local")}</div>
          <div class="card-desc">${escapeHtml(it.descricao || "(sem descrição)")}</div>
          ${it.codigo ? `<div class="card-code">${escapeHtml(it.codigo)}</div>` : ""}
          <div class="card-actions">
            <button class="btn-ghost btn-sm" data-edit="${it.id}">Editar</button>
            <button class="btn-danger btn-sm" data-del="${it.id}">Excluir</button>
          </div>
        </div>
      </div>
    `).join("");

    // Clicar na foto amplia a imagem; clicar no resto do card abre a edição.
    grid.querySelectorAll(".card").forEach((card) => {
      card.addEventListener("click", (ev) => {
        if (ev.target.closest("[data-edit], [data-del]")) return;
        const thumb = ev.target.closest("[data-photo]");
        if (thumb) { openLightbox(thumb.dataset.photo); return; }
        openItemModal(card.dataset.id);
      });
    });
    grid.querySelectorAll("[data-edit]").forEach((b) => b.addEventListener("click", () => openItemModal(b.dataset.edit)));
    grid.querySelectorAll("[data-del]").forEach((b) => b.addEventListener("click", () => deleteItem(b.dataset.del)));
  }

  // ---------- Lightbox ----------
  function openLightbox(url) {
    const div = document.createElement("div");
    div.className = "lightbox-backdrop";
    div.innerHTML = `<img src="${url}" alt="">`;
    div.addEventListener("click", () => div.remove());
    document.body.appendChild(div);
  }

  searchInput.addEventListener("input", renderGrid);
  filterLocal.addEventListener("change", renderGrid);

  async function deleteItem(id) {
    const it = items.find((x) => x.id === id);
    const ok = await confirmDialog(
      "Excluir item",
      `Excluir "${it ? it.descricao : "este item"}" do inventário? Essa ação não pode ser desfeita.`
    );
    if (!ok) return;
    try {
      await apiPost({ action: "deleteItem", id: id });
      await refreshAll();
      toast("Item excluído.");
    } catch (e) { toast("Não foi possível excluir."); }
  }

  // ---------- Confirmação (substitui window.confirm) ----------
  function confirmDialog(title, text) {
    return new Promise((resolve) => {
      const backdrop = $("#confirmModalBackdrop");
      $("#confirmModalTitle").textContent = title;
      $("#confirmModalText").textContent = text;
      backdrop.style.display = "flex";

      function cleanup(result) {
        backdrop.style.display = "none";
        okBtn.removeEventListener("click", onOk);
        cancelBtn.removeEventListener("click", onCancel);
        backdrop.removeEventListener("click", onBackdrop);
        resolve(result);
      }
      const okBtn = $("#btnConfirmOk");
      const cancelBtn = $("#btnConfirmCancel");
      function onOk() { cleanup(true); }
      function onCancel() { cleanup(false); }
      function onBackdrop(ev) { if (ev.target === backdrop) cleanup(false); }

      okBtn.addEventListener("click", onOk);
      cancelBtn.addEventListener("click", onCancel);
      backdrop.addEventListener("click", onBackdrop);
    });
  }

  // ---------- Item modal ----------
  function openItemModal(id) {
    editingId = id || null;
    pendingPhoto = null;
    const it = id ? items.find((x) => x.id === id) : null;

    $("#itemModalTitle").textContent = it ? "Editar item" : "Novo item";
    $("#fLocal").value = it ? it.local : (locais[0] || "");
    $("#fDescricao").value = it ? it.descricao || "" : "";
    $("#fCodigo").value = it ? it.codigo || "" : "";

    const photoZone = $("#photoZone");
    if (it && it.fotoUrl) {
      pendingPhoto = { keepUrl: it.fotoUrl };
      photoZone.innerHTML = `<img src="${it.fotoUrl}" alt=""><span>Toque para trocar a foto</span>`;
    } else {
      photoZone.innerHTML = `<span>Toque para tirar ou escolher uma foto</span>`;
    }

    stopScan();
    $("#itemModalBackdrop").style.display = "flex";
  }

  $("#btnAdd").addEventListener("click", () => openItemModal(null));
  $("#btnCancelItem").addEventListener("click", closeItemModal);
  function closeItemModal() {
    stopScan();
    $("#itemModalBackdrop").style.display = "none";
  }

  $("#photoZone").addEventListener("click", () => $("#fFoto").click());
  $("#fFoto").addEventListener("change", (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const url = URL.createObjectURL(file);
    pendingPhoto = { file: file, previewUrl: url };
    $("#photoZone").innerHTML = `<img src="${url}" alt=""><span>Toque para trocar a foto</span>`;
  });

  function fileToBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result.split(",")[1]);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  $("#btnSaveItem").addEventListener("click", saveItem);

  async function saveItem() {
    const local = $("#fLocal").value;
    const descricao = $("#fDescricao").value.trim();
    const codigo = $("#fCodigo").value.trim();

    if (!descricao) { toast("Informe uma descrição."); return; }

    const btn = $("#btnSaveItem");
    btn.disabled = true;
    btn.textContent = "Salvando…";

    try {
      let fotoUrl = "";
      if (pendingPhoto && pendingPhoto.file) {
        btn.textContent = "Enviando foto…";
        const base64 = await fileToBase64(pendingPhoto.file);
        const up = await apiPost({ action: "uploadPhoto", base64: base64, mimeType: pendingPhoto.file.type });
        if (!up.ok) throw new Error(up.error || "Falha no upload da foto");
        fotoUrl = up.url;
      } else if (pendingPhoto && pendingPhoto.keepUrl) {
        fotoUrl = pendingPhoto.keepUrl;
      }

      btn.textContent = "Salvando…";
      if (editingId) {
        await apiPost({ action: "updateItem", id: editingId, local: local, descricao: descricao, codigo: codigo, fotoUrl: fotoUrl });
        toast("Item atualizado.");
      } else {
        await apiPost({ action: "addItem", local: local, descricao: descricao, codigo: codigo, fotoUrl: fotoUrl });
        toast("Item cadastrado.");
      }
      await refreshAll();
      closeItemModal();
    } catch (e) {
      toast("Não foi possível salvar. Tente novamente.");
    } finally {
      btn.disabled = false;
      btn.textContent = "Salvar";
    }
  }

  // ---------- QR scan ----------
  $("#btnScan").addEventListener("click", async () => {
    const box = $("#qr-reader");
    if (box.style.display === "none") {
      box.style.display = "block";
      try {
        html5QrCode = new Html5Qrcode("qr-reader");
        await html5QrCode.start(
          { facingMode: "environment" },
          { fps: 10, qrbox: 220 },
          (decodedText) => {
            $("#fCodigo").value = decodedText;
            toast("Código lido.");
            stopScan();
          },
          () => {}
        );
      } catch (e) {
        toast("Não foi possível acessar a câmera.");
        box.style.display = "none";
      }
    } else {
      stopScan();
    }
  });

  function stopScan() {
    const box = $("#qr-reader");
    if (html5QrCode) {
      html5QrCode.stop().then(() => html5QrCode.clear()).catch(() => {});
      html5QrCode = null;
    }
    box.style.display = "none";
    box.innerHTML = "";
  }

  init();
})();
</script>
</body>
</html>
